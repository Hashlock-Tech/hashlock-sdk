[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hashlock-sdk"
version = "0.5.0"
description = "Python SDK for the Hashlock Markets developer API — non-custodial cross-chain atomic swaps (BTC <-> EVM/TRON/Solana) over sealed RFQ + HTLC."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["hashlock", "atomic-swap", "htlc", "bitcoin", "cross-chain", "otc", "defi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
ws = ["websockets>=12"]

[project.urls]
Homepage = "https://github.com/Hashlock-Tech/hashlock-sdk"

[tool.hatch.build.targets.wheel]
packages = ["hashlock"]
