name: Release PyPI

# Publish hashlock-sdk. Trigger: a package-scoped tag, e.g. `python-v1.0.0`.
#   git tag python-v1.0.0 && git push origin python-v1.0.0
# Build runs WITHOUT OIDC; only the minimal `publish` job holds `id-token: write` and does nothing but
# publish the prebuilt distributions. Uses OIDC Trusted Publishing (no long-lived token in the repo) —
# configure the PyPI trusted publisher once against THIS workflow file (release-pypi.yml).
on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (no OIDC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify tag matches pyproject version
        working-directory: python
        run: |
          TAG="${GITHUB_REF_NAME#python-v}"
          PKG="$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)"
          echo "tag=$TAG pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $PKG"; exit 1; }
      - run: pip install build
      - run: python -m build
        working-directory: python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-dist
          path: dist
      # PINNED TO v1.14.2, and it had to move: the older pin shipped a twine that refuses
      # `Metadata-Version: 2.5`, which is what current hatchling writes — so 0.5.0 built fine and then
      # failed at the upload with "'2.5' is not a valid metadata version". The build side is
      # deliberately NOT pinned instead: following the packaging tools is the point of a build.
      # The pin must be the COMMIT v1.14.2 points at, not the annotated tag's own object id: this is a
      # Docker action, and it pulls ghcr.io/pypa/gh-action-pypi-publish:<ref>, where only commit SHAs and
      # version strings exist as image tags. The tag-object id pulled nothing — "manifest unknown".
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
        # Trusted publisher configured → no token needed.
        # Token fallback: add `password: ${{ secrets.PYPI_TOKEN }}`.
